name: Publish

# Release flow: `npm version <patch|minor|major>` then `git push --follow-tags`.
# Pushing the resulting `vX.Y.Z` tag triggers this workflow, which builds the wasm,
# publishes that version to npm using the NPM_TOKEN secret (a granular access token
# scoped to the @sabaki packages with read-write + bypass-2fa) and cuts a matching
# GitHub Release.
#
# A prerelease tag (e.g. v3.1.1-rc.0) publishes under the `next` dist-tag instead
# of `latest`, and its GitHub Release is marked as a prerelease.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # publish creates a GitHub Release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # The runner ships rustup + stable Rust; rust-toolchain.toml adds the wasm
      # target, and wasm-pack drives the build (also run by prepublishOnly).
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Check tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($pkg)"
            exit 1
          fi

      - run: npm ci

      - name: Build wasm
        run: npm run build

      # tap's CLI doesn't run on modern Node, so `npm test` runs each suite with node.
      - run: npm test

      - name: Publish to npm
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) npm publish --tag next ;;   # prerelease -> next
            *)   npm publish ;;              # stable -> latest
          esac
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Match the repo's release-title convention: "<package name> vX.Y.Z".
          title="$(node -p "require('./package.json').name") $GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in
            *-*) gh release create "$GITHUB_REF_NAME" --title "$title" --generate-notes --prerelease ;;
            *)   gh release create "$GITHUB_REF_NAME" --title "$title" --generate-notes ;;
          esac
